name: EasyEPG XML and JSON compatibility

on:
  pull_request:
    paths:
      - requirements.txt
      - .github/scripts/dependency-compatibility.py
      - .github/workflows/dependency-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easyepg-parser-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned upstream application source
        uses: actions/checkout@v7
        with:
          repository: sunsettrack4/script.service.easyepg-lite
          ref: 1790ef68b1dba8c12d453cc7f47a465a2fc41a6b
          path: _compat_source
          persist-credentials: false
      - name: Compare baseline and both dependency upgrades offline
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p parser-results "$RUNNER_TEMP/parser-build"
          cat > "$RUNNER_TEMP/parser-build/Dockerfile" <<'EOF'
          FROM python:3.12-slim
          ARG XMLTODICT_VERSION
          ARG SIMPLEJSON_VERSION
          RUN python -m pip install --no-cache-dir \
              "requests==2.34.2" "xmltodict==${XMLTODICT_VERSION}" "simplejson==${SIMPLEJSON_VERSION}" \
              && python -m pip check
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
          EOF
          for spec in \
            'baseline 0.15.1 3.20.2' \
            'xml-only 1.0.4 3.20.2' \
            'json-only 0.15.1 4.1.2' \
            'combined 1.0.4 4.1.2'
          do
            read -r label xml_version json_version <<< "$spec"
            docker build --pull --tag "easyepg-parser-test:$label" \
              --build-arg "XMLTODICT_VERSION=$xml_version" \
              --build-arg "SIMPLEJSON_VERSION=$json_version" \
              "$RUNNER_TEMP/parser-build"
            docker run --rm --network none --read-only --user 65532:65532 \
              --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m \
              --env EASYEPG_SOURCE=/source \
              --mount "type=bind,src=$PWD/_compat_source,dst=/source,readonly" \
              --mount "type=bind,src=$PWD/.github/scripts/dependency-compatibility.py,dst=/test.py,readonly" \
              --entrypoint python "easyepg-parser-test:$label" /test.py \
              2>&1 | tee "parser-results/$label.log"
            sed -n 's/^SNAPSHOT_JSON=//p' "parser-results/$label.log" > "parser-results/$label.json"
            test -s "parser-results/$label.json"
          done
          for label in xml-only json-only combined; do
            cmp parser-results/baseline.json "parser-results/$label.json"
            echo "$label: results match the baseline"
          done
      - name: Save compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: easyepg-parser-compatibility
          path: parser-results/
          if-no-files-found: warn
          retention-days: 14
