name: EasyEPG XML and JSON compatibility

on:
  pull_request:
    paths:
      - requirements.txt
      - Dockerfile.*
      - .github/scripts/dependency-compatibility.py
      - .github/scripts/parser_inputs.py
      - .github/scripts/test_parser_inputs.py
      - .github/workflows/dependency-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easyepg-parser-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read pinned upstream application source
        uses: actions/checkout@v7
        with:
          repository: sunsettrack4/script.service.easyepg-lite
          ref: 49bdfe5400e8cdadcd9df1f4245263080f7c30ab
          path: _compat_source
          persist-credentials: false
      - name: Compare exact base and candidate revisions offline
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BASE_SHA" ]]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
          mkdir -p parser-results "$RUNNER_TEMP/parser-build"
          for label in baseline candidate; do
            revision="$HEAD_SHA"
            if [[ "$label" == baseline ]]; then revision="$BASE_SHA"; fi
            context="$RUNNER_TEMP/parser-build/$label"
            image="$(python3 .github/scripts/parser_inputs.py "$revision" "$context")"
            cp "$context/metadata.json" "parser-results/$label-inputs.json"
            cat "parser-results/$label-inputs.json"
            docker build --pull --tag "easyepg-parser-test:$label" \
              --build-arg "PYTHON_IMAGE=$image" "$context"
            docker run --rm --network none --read-only --user 65532:65532 \
              --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m \
              --env EASYEPG_SOURCE=/source \
              --mount "type=bind,src=$PWD/_compat_source,dst=/source,readonly" \
              --mount "type=bind,src=$PWD/.github/scripts/dependency-compatibility.py,dst=/test.py,readonly" \
              --entrypoint python "easyepg-parser-test:$label" /test.py \
              2>&1 | tee "parser-results/$label.log"
            sed -n 's/^SNAPSHOT_JSON=//p' "parser-results/$label.log" > "parser-results/$label.json"
            test -s "parser-results/$label.json"
          done
          cmp parser-results/baseline.json parser-results/candidate.json
          echo "Candidate $HEAD_SHA matches baseline $BASE_SHA for all XML/JSON fixtures."
      - name: Save compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: easyepg-parser-compatibility
          path: parser-results/
          if-no-files-found: warn
          retention-days: 14
