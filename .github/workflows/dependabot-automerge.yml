name: Dependabot patch auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows:
      - Build & Push to Docker Hub (multi-arch)
      - EasyEPG XML and JSON compatibility
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  classify:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark eligible patch update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -Eeuo pipefail

          eligible=false
          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
            case "$ECOSYSTEM" in
              pip|github_actions)
                eligible=true
                ;;
            esac
          fi

          if [[ "$eligible" == "true" ]]; then
            gh label create "automerge:patch"               --repo "$GITHUB_REPOSITORY"               --description "Verified Dependabot patch update eligible for automatic merge"               --color "0E8A16"               --force
            gh pr edit "$PR_NUMBER"               --repo "$GITHUB_REPOSITORY"               --add-label "automerge:patch"
          else
            gh pr edit "$PR_NUMBER"               --repo "$GITHUB_REPOSITORY"               --remove-label "automerge:patch" >/dev/null 2>&1 || true
          fi

  merge:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge eligible patch update after all required checks pass
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"

          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          AUTHOR="$(jq -r '.user.login' <<<"$PR_JSON")"
          BASE="$(jq -r '.base.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"

          if [[ "$STATE" != "open" || "$AUTHOR" != "dependabot[bot]" || "$BASE" != "master" || "$DRAFT" != "false" ]]; then
            echo "PR is not an eligible open Dependabot PR for master."
            exit 0
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels"             --jq '.[].name' | grep -Fxq 'automerge:patch'; then
            echo "PR is not marked for patch auto-merge."
            exit 0
          fi

          mapfile -t FILES < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100"               --jq '.[].filename'
          )

          if (( ${#FILES[@]} == 0 )); then
            echo "No changed files found."
            exit 0
          fi

          need_compat=false
          if (( ${#FILES[@]} == 1 )) && [[ "${FILES[0]}" == "requirements.txt" ]]; then
            need_compat=true
          else
            for file in "${FILES[@]}"; do
              case "$file" in
                .github/workflows/dockerhub.yml)
                  ;;
                .github/workflows/dependency-compatibility.yml)
                  need_compat=true
                  ;;
                *)
                  echo "Unexpected file for automatic merge: $file"
                  exit 0
                  ;;
              esac
            done
          fi

          CHECKS="$(gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"

          require_success() {
            local name="$1"
            if ! jq -e --arg name "$name"               '.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")'               <<<"$CHECKS" >/dev/null; then
              echo "Required check is not successful yet: $name"
              exit 0
            fi
          }

          require_success "prep"
          require_success "assemble"

          ARCH_SUCCESS="$(jq             '[.check_runs[]
              | select(.name | startswith("build-arch ("))
              | select(.status == "completed" and .conclusion == "success")]
             | length' <<<"$CHECKS")"

          if [[ "$ARCH_SUCCESS" -lt 3 ]]; then
            echo "Not all three architecture checks are successful yet."
            exit 0
          fi

          if [[ "$need_compat" == "true" ]]; then
            require_success "compare-parsers"
          fi

          echo "All required checks passed for PR #$PR_NUMBER. Merging."
          gh pr merge "$PR_NUMBER"             --repo "$GITHUB_REPOSITORY"             --merge
