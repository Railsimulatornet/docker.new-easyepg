name: Dependabot patch auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows:
      - Build & Push to Docker Hub (multi-arch)
      - EasyEPG XML and JSON compatibility
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  classify:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark eligible patch update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -Eeuo pipefail

          eligible=false
          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
            case "$ECOSYSTEM" in
              pip)
                eligible=true
                ;;
            esac
          fi

          if [[ "$eligible" == "true" ]]; then
            gh label create "automerge:patch"               --repo "$GITHUB_REPOSITORY"               --description "Verified Dependabot patch update eligible for automatic merge"               --color "0E8A16"               --force
            gh pr edit "$PR_NUMBER"               --repo "$GITHUB_REPOSITORY"               --add-label "automerge:patch"
          else
            gh pr edit "$PR_NUMBER"               --repo "$GITHUB_REPOSITORY"               --remove-label "automerge:patch" >/dev/null 2>&1 || true
          fi

  merge:
    permissions:
      actions: read
      contents: write
      pull-requests: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge eligible patch update after all required checks pass
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"

          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          AUTHOR="$(jq -r '.user.login' <<<"$PR_JSON")"
          BASE="$(jq -r '.base.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"

          if [[ "$STATE" != "open" || "$AUTHOR" != "dependabot[bot]" || "$BASE" != "master" || "$DRAFT" != "false" ]]; then
            echo "PR is not an eligible open Dependabot PR for master."
            exit 0
          fi

          # Never consume a completed run belonging to an older PR commit.
          TRIGGER_SHA="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
          HEAD_REPO="$(jq -r '.head.repo.full_name // empty' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref // empty' <<<"$PR_JSON")"
          if [[ "$TRIGGER_SHA" != "$HEAD_SHA" || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ||
                "$HEAD_REF" != dependabot/* ]]; then
            echo "Not the current same-repository Dependabot commit."
            exit 0
          fi
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          BASE_SHA="$(jq -r '.base.sha' <<<"$PR_JSON")"
          if [[ "$MAIN_SHA" != "$BASE_SHA" ]]; then
            echo "PR base is stale; requires rebase."
            exit 0
          fi
          BEHIND="$(gh api "repos/$GITHUB_REPOSITORY/compare/$MAIN_SHA...$HEAD_SHA" --jq '.behind_by')"
          if [[ "$BEHIND" != 0 ]]; then
            echo "Dependabot branch is behind master."
            exit 0
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels"             --jq '.[].name' | grep -Fxq 'automerge:patch'; then
            echo "PR is not marked for patch auto-merge."
            exit 0
          fi

          # Only standalone pip patch updates of requirements.txt are eligible.
          # GitHub-Actions updates remain manual, even when their CI is green.
          FILES_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"
          if ! jq -e 'length == 1
            and .[0].filename == "requirements.txt"
            and .[0].status == "modified"
            and .[0].additions == 1
            and .[0].deletions == 1
            and (.[0].patch | type == "string")' <<<"$FILES_JSON" >/dev/null; then
            echo "Unexpected files or non-atomic requirements patch; manual review required."
            exit 0
          fi

          CHECKS="$(gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"

          require_success() {
            local name="$1"
            if ! jq -e --arg name "$name"               '.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")'               <<<"$CHECKS" >/dev/null; then
              echo "Required check is not successful yet: $name"
              exit 0
            fi
          }

          require_success "prep"
          require_success "assemble"

          ARCH_SUCCESS="$(jq             '[.check_runs[]
              | select(.name | startswith("build-arch ("))
              | select(.status == "completed" and .conclusion == "success")]
             | length' <<<"$CHECKS")"

          if [[ "$ARCH_SUCCESS" -lt 3 ]]; then
            echo "Not all three architecture checks are successful yet."
            exit 0
          fi

          require_success "compare-parsers"

          # The multiarch build and parser compatibility run are mandatory.
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100")"
          if ! jq -e '
            ([.workflow_runs[]
              | select(.name == "Build & Push to Docker Hub (multi-arch)"
                       and .status == "completed" and .conclusion == "success")] | length) >= 1
            and
            ([.workflow_runs[]
              | select(.name == "EasyEPG XML and JSON compatibility"
                       and .status == "completed" and .conclusion == "success")] | length) >= 1
            and
            ([.workflow_runs[]
              | select(.status != "completed" or .conclusion != "success")] | length) == 0
          ' <<<"$RUNS" >/dev/null; then
            echo "Both required PR workflows must pass; no pending/failed runs allowed."
            exit 0
          fi

          # A passing matrix job is not enough if another check failed or is neutral.
          if ! jq -e '
            (.check_runs | length > 0)
            and all(.check_runs[];
              # Own workflow_run gate jobs may be skipped or in progress
              # while checking the PR. They cannot act as approval checks.
              (.name == "classify" or .name == "merge")
              or
              (.status == "completed"
               and (.conclusion == "success"
                    or (.name == "publish" and .conclusion == "skipped")))
            )
          ' <<<"$CHECKS" >/dev/null; then
            echo "A check is skipped unexpectedly, neutral, missing or not successful."
            exit 0
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.state != "success")] | length == 0' |
              grep -Fxq true; then
            echo "Unsuccessful legacy commit status."
            exit 0
          fi

          # The merge endpoint compares the verified head SHA atomically.
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          [[ "$CURRENT_MAIN" == "$MAIN_SHA" ]] || {
            echo "master advanced during verification."
            exit 0
          }
          echo "All required checks passed for PR #$PR_NUMBER. Merging the exact SHA."
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$HEAD_SHA" -f merge_method=merge \
            --jq '.merged' | grep -Fxq true
